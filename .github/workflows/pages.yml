name: Deploy site

# Publie sur GitHub Pages un site *pré-calculé*.
#
# Le site n'est plus assemblé à la main : scripts/build_site.py lit les TSV de
# data/gcat/, agrège les lancements par Launch_Tag, rend les classements en HTML
# et écrit l'explorateur JSON dans _site/. L'artefact publié ne contient que le
# résultat : ni données brutes, ni scripts.
#
# Déclencheurs :
#   - push sur main (templates, scripts, CSS, JS, données) ;
#   - fin du workflow « Update GCAT data » : indispensable car un commit poussé
#     avec GITHUB_TOKEN ne déclenche pas les workflows « push » ;
#   - lancement manuel.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Update GCAT data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Tente d'activer Pages (build_type: workflow) si ce n'est pas déjà fait.
          enablement: true

      - name: Build pre-computed site
        run: python3 scripts/build_site.py --data data/gcat --out _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      # Race connue de actions/deploy-pages (issue #451) : le premier appel peut
      # ne pas voir l'artefact qui vient d'être téléversé (« Found 0 artifact(s) »).
      # On réessaie le déploiement seul, avec une pause croissante — jamais
      # l'upload, car un second artefact « github-pages » ferait échouer la
      # recherche sur doublon.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deployment again
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
          TRIGGER: ${{ github.event_name }}
        run: |
          echo '### Publication GitHub Pages' >> "$GITHUB_STEP_SUMMARY"
          echo "- URL : $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Déclencheur : `$TRIGGER`" >> "$GITHUB_STEP_SUMMARY"
          du -sh _site 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
