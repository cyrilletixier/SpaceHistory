name: Check build

# Vérifie qu'une pull request produit bien un _site/ complet.
# Ne déploie rien : la publication reste le monopole de « Deploy site » sur main.
# L'artefact « site-preview » permet de comparer le rendu avant fusion.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build _site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python3 scripts/build_site.py --data data/gcat --out _site

      - name: Sanity checks
        run: |
          set -euo pipefail
          for page in \
            index.html \
            launches.html \
            charges-utiles.html \
            objets.html \
            sitemap.xml \
            robots.txt \
            data/launches.json \
            data/charges-utiles.json \
            classements/index.html \
            classements/decennies.html \
            classements/annees.html \
            classements/lanceurs.html \
            classements/sites.html \
            classements/agences.html \
            classements/pays.html \
            assets/css/style.css \
            assets/js/explorer.js \
            assets/js/charges-utiles.js ; do
            test -s "_site/$page" || { echo "fichier manquant ou vide : $page" ; exit 1 ; }
          done
          # Garde-fou : un classement ajouté à RANKINGS sans page rendue, ou une
          # page vidée par un template cassé, ne doit pas passer la CI.
          expected=$(ls _site/classements/*.html | wc -l)
          test "$expected" -ge 7 || { echo "pages de classement manquantes : $expected" ; exit 1 ; }
          echo "--- poids ---"
          du -sh _site
          du -h _site/data/launches.json _site/data/charges-utiles.json

      - name: Check payload fields
        run: |
          # Les colonnes « masse en orbite » et « destination » sont calculées au
          # build : si la jointure launchlog → satcat casse (colonne renommée,
          # fichier absent), le site publierait des colonnes vides sans que rien
          # ne signale l'erreur. On vérifie donc que les deux champs sont
          # réellement renseignés, et on refuse un _site/ silencieusement vide.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          launches = json.loads(Path("_site/data/launches.json").read_text(encoding="utf-8"))["launches"]
          payloads = json.loads(Path("_site/data/charges-utiles.json").read_text(encoding="utf-8"))["payloads"]

          total = len(launches)
          with_payloads = sum(1 for item in launches if item.get("pc"))
          with_mass = sum(1 for item in launches if item.get("m"))
          with_destination = sum(1 for item in launches if item.get("dd"))
          known_mass = sum(item.get("m") or 0 for item in launches)

          print(f"lancements : {total}")
          print(f"  avec charges utiles : {with_payloads} ({100 * with_payloads / total:.1f} %)")
          print(f"  avec masse connue   : {with_mass} ({100 * with_mass / total:.1f} %)")
          print(f"  avec destination    : {with_destination} ({100 * with_destination / total:.1f} %)")
          print(f"  masse cumulée       : {known_mass / 1000:.0f} t")
          print(f"charges utiles : {len(payloads)}")

          failures = []
          if not payloads:
              failures.append("aucune charge utile lue (satcat.tsv / ftocat.tsv ?)")
          if total and with_destination / total < 0.5:
              failures.append(f"destination renseignée sur seulement {with_destination}/{total} lancements")
          if total and with_mass / total < 0.3:
              failures.append(f"masse renseignée sur seulement {with_mass}/{total} lancements")

          # Un vol avec des charges utiles doit avoir une destination lisible.
          orphan = [item["t"] for item in launches if item.get("pi") and not item.get("dd")]
          if orphan:
              print(f"vols avec charges utiles mais sans destination ({len(orphan)}) : "
                    + ", ".join(orphan[:10]))
              failures.append(f"{len(orphan)} vol(s) sans destination malgré des charges utiles")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          PY

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
