name: Check build

# Vérifie qu'une pull request produit bien un _site/ complet.
# Ne déploie rien : la publication reste le monopole de « Deploy site » sur main.
# L'artefact « site-preview » permet de comparer le rendu avant fusion.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build _site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python3 scripts/build_site.py --data data/gcat --out _site

      - name: Sanity checks
        run: |
          set -euo pipefail
          for page in \
            index.html \
            launches.html \
            charges-utiles.html \
            objets.html \
            sitemap.xml \
            robots.txt \
            data/launches.json \
            data/charges-utiles.json \
            classements/index.html \
            classements/decennies.html \
            classements/annees.html \
            classements/lanceurs.html \
            classements/sites.html \
            classements/agences.html \
            classements/pays.html \
            assets/css/style.css \
            assets/js/explorer.js \
            assets/js/charges-utiles.js ; do
            test -s "_site/$page" || { echo "fichier manquant ou vide : $page" ; exit 1 ; }
          done
          # Garde-fou : un classement ajouté à RANKINGS sans page rendue, ou une
          # page vidée par un template cassé, ne doit pas passer la CI.
          expected=$(ls _site/classements/*.html | wc -l)
          test "$expected" -ge 7 || { echo "pages de classement manquantes : $expected" ; exit 1 ; }
          # Les filtres d'équipage sont rendus par le JS : si le select a disparu
          # du template, le filtre est mort sans qu'aucune erreur ne le dise.
          for id in f-crewed note-crewed ; do
            grep -q "id=\"$id\"" _site/launches.html \
              || { echo "contrôle manquant dans launches.html : $id" ; exit 1 ; }
          done
          # La colonne « Habité » est écrite par le template (en-tête triable)
          # mais remplie par explorer.js : si l'en-tête disparaît, le marqueur
          # reste dans le JSON sans qu'aucune ligne du site ne l'affiche.
          grep -q 'data-sort="crewed"' _site/launches.html \
            || { echo "colonne « Habité » triable absente de launches.html" ; exit 1 ; }
          grep -q 'crewedCell' _site/assets/js/explorer.js \
            || { echo "rendu de la colonne « Habité » absent de explorer.js" ; exit 1 ; }
          # Les colonnes « objets » et « charges utiles » sont fusionnées en une
          # seule cellule cliquable : si l'en-tête fusionné disparaît, ou si
          # l'ancienne colonne « charges utiles » revient, le lien vers la page
          # des charges utiles se casse sans qu'aucune erreur ne le dise.
          grep -q 'data-sort="objects"' _site/launches.html \
            || { echo "colonne « Objets / charges utiles » absente de launches.html" ; exit 1 ; }
          if grep -q 'data-sort="payloads"' _site/launches.html ; then
            echo "colonne « Charges utiles » séparée encore présente : la fusion n'est plus effective" ; exit 1
          fi
          grep -q 'objectsCell' _site/assets/js/explorer.js \
            || { echo "rendu de la colonne fusionnée absent de explorer.js" ; exit 1 ; }
          # Le bandeau du vol filtré affiche le décompte des objets non listés
          # (étages, débris) : il est rendu par charges-utiles.js, et si le
          # rendu disparaît le lecteur ne sait plus ce qui manque au catalogue.
          grep -q 'non listé' _site/assets/js/charges-utiles.js \
            || { echo "décompte des objets non listés absent de charges-utiles.js" ; exit 1 ; }
          echo "--- poids ---"
          du -sh _site
          du -h _site/data/launches.json _site/data/charges-utiles.json

      - name: Check payload fields
        run: |
          # Les colonnes « masse en orbite », « destination » et « vol habité »
          # sont calculées au build : si la jointure launchlog → satcat casse
          # (colonne renommée, fichier absent), le site publierait des colonnes
          # vides sans que rien ne signale l'erreur. On vérifie donc que les
          # champs sont réellement renseignés, et on refuse un _site/ vide.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          launches = json.loads(Path("_site/data/launches.json").read_text(encoding="utf-8"))["launches"]
          payloads = json.loads(Path("_site/data/charges-utiles.json").read_text(encoding="utf-8"))["payloads"]

          total = len(launches)
          with_payloads = sum(1 for item in launches if item.get("pc"))
          with_mass = sum(1 for item in launches if item.get("m"))
          with_destination = sum(1 for item in launches if item.get("dd"))
          known_mass = sum(item.get("m") or 0 for item in launches)
          crewed = [item["t"] for item in launches if item.get("cr")]
          crewed_failed = [
              item["t"] for item in launches
              if item.get("cr") and item.get("st") == "échec"
          ]
          crewed_payloads = sum(1 for item in payloads if item.get("cr"))

          print(f"lancements : {total}")
          print(f"  avec charges utiles : {with_payloads} ({100 * with_payloads / total:.1f} %)")
          print(f"  avec masse connue   : {with_mass} ({100 * with_mass / total:.1f} %)")
          print(f"  avec destination    : {with_destination} ({100 * with_destination / total:.1f} %)")
          print(f"  masse cumulée       : {known_mass / 1000:.0f} t")
          print(f"  vols habités        : {len(crewed)} (dont {len(crewed_failed)} en échec)")
          print(f"charges utiles : {len(payloads)} (dont {crewed_payloads} sur un vol habité)")

          failures = []
          if not payloads:
              failures.append("aucune charge utile lue (satcat.tsv / ftocat.tsv ?)")
          if total and with_destination / total < 0.5:
              failures.append(f"destination renseignée sur seulement {with_destination}/{total} lancements")
          if total and with_mass / total < 0.3:
              failures.append(f"masse renseignée sur seulement {with_mass}/{total} lancements")

          # Un vol avec des charges utiles doit avoir une destination lisible.
          orphan = [item["t"] for item in launches if item.get("pi") and not item.get("dd")]
          if orphan:
              print(f"vols avec charges utiles mais sans destination ({len(orphan)}) : "
                    + ", ".join(orphan[:10]))
              failures.append(f"{len(orphan)} vol(s) sans destination malgré des charges utiles")

          # Marqueur d'équipage : le GCAT l'encode dans le 2e caractère du champ
          # `Type`. Un total dans la fourchette ne suffit pas — une règle qui
          # lirait le 4e caractère (« véhicule habitable ») en produirait un du
          # même ordre de grandeur. D'où ces contrôles nominatifs, dont trois
          # véhicules habitables qui n'ont jamais volé avec personne.
          if not 340 <= len(crewed) <= 400:
              failures.append(
                  f"vols habités hors fourchette 340-400 : {len(crewed)} "
                  "— encodage de Type changé ?"
              )

          controls = {
              "1968-025": False,  # Apollo 6, véhicule habitable, vol sans équipage
              "1968-089": True,   # Apollo 7, premier vol habité du programme
              "1988-100": False,  # Buran OK-1K, lancé sans équipage
              "1999-061": False,  # Shenzhou 1
              "2003-045": True,   # Shenzhou 5
              "2019-011": False,  # Crew Dragon Demo-1
              "2021-053": True,   # Shenzhou 12
          }
          by_tag = {item["t"]: bool(item.get("cr")) for item in launches}
          wrong = [
              f"{tag} (attendu {want}, obtenu {by_tag.get(tag)})"
              for tag, want in controls.items()
              if by_tag.get(tag) != want
          ]
          if wrong:
              print("vols de contrôle mal marqués : " + " ; ".join(wrong))
              failures.append(f"{len(wrong)} vol(s) de contrôle mal marqués pour l'équipage")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          PY

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
